<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>繁化助手下載點</title>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff6da;
      color: #4a3f1f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
        "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      padding: 3rem 1.25rem;
      box-sizing: border-box;
    }
    main {
      width: 100%;
      max-width: 560px;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 2rem;
      text-align: center;
    }
    section {
      background: #fffdf5;
      border: 1px solid #ecdca3;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }
    h2 {
      font-size: 1.15rem;
      margin: 0 0 1rem;
    }

    /* 一個版本區塊＝一個版本號小標 + 該版本底下各分流的下載選項。
       之後同一個平台出新版本，就在同一個 section 裡再加一個
       .version-block（放在最上面，新版在前）——版本區塊之間的分隔線
       靠 + 這個相鄰兄弟選擇器自動出現，只有一個版本時完全不會畫出來，
       不用另外判斷「是不是第一個版本」。 */
    .version-block + .version-block {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid #ecdca3;
    }
    .version-label {
      margin: 0 0 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #9a8a54;
      letter-spacing: 0.02em;
    }
    /* 用 grid 切成剛好兩等分，不是 flex 的 space-between——space-between
       只會把兩塊推到最左/最右，中間那條界線實際上跟著兩塊各自的內容
       寬度跑，不是真正固定在正中間。grid-template-columns: 1fr 1fr
       保證第二欄永遠從容器正中間開始，Mac OS 12 那塊固定貼齊中線
       右側，不受文字/按鈕寬度影響。 */
    .tier-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .tier {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .tier span {
      font-size: 0.95rem;
    }
    .tier a {
      display: inline-block;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      background: #4a3f1f;
      color: #fff6da;
      text-decoration: none;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .empty-note {
      margin: 0;
      color: #9a8a54;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>繁化助手下載點</h1>

    <section>
      <h2>Mac</h2>
      <div class="version-block">
        <p class="version-label">1.3</p>
        <div class="tier-row">
          <div class="tier">
            <span>Mac OS 13（含）以上</span>
            <a href="https://github.com/beethoreven/zh-cn-to-tw-mac/releases/download/v1.3-13-plus/ZhCnToTw-1.3-13+.dmg">下載</a>
          </div>
          <div class="tier">
            <span>Mac OS 12（含）以下</span>
            <a href="https://github.com/beethoreven/zh-cn-to-tw-mac/releases/download/v1.3-12-minus/ZhCnToTw-1.3-12-.dmg">下載</a>
          </div>
        </div>
      </div>
      <div class="version-block">
        <p class="version-label">1.1</p>
        <div class="tier-row">
          <div class="tier">
            <span>Mac OS 13（含）以上</span>
            <a href="https://github.com/beethoreven/zh-cn-to-tw-mac/releases/download/v1.1-13-plus/ZhCnToTw-1.1-13+.dmg">下載</a>
          </div>
          <div class="tier">
            <span>Mac OS 12（含）以下</span>
            <a href="https://github.com/beethoreven/zh-cn-to-tw-mac/releases/download/v1.1-12-minus/ZhCnToTw-1.1-12-.dmg">下載</a>
          </div>
        </div>
      </div>
      <!-- 之後出新版本，在這個 section 裡、上面這個 .version-block
           之前再插一個新的 .version-block（新版在前）即可，分隔線會
           自動出現，不用改其他地方。 -->
    </section>

    <section>
      <h2>Windows</h2>
      <div class="version-block">
        <p class="version-label">1.2</p>
        <div class="tier">
          <span>Windows 10（1607 以上）／ Windows 11，64 位元</span>
          <a href="https://github.com/beethoreven/zh-cn-to-tw-windows/releases/download/v1.2/ZhCnToTw-Setup-1.2.exe">下載</a>
        </div>
      </div>
      <!-- Windows 目前只有一個通用版本（不像 Mac 分 13+/12- 兩個分流），
           不用 .tier-row，直接一個 .tier 放單一下載選項就好。之後出
           新版本，比照 Mac 的做法在這個 section 裡、上面這個
           .version-block 之前再插一個新的 .version-block（新版在前）。 -->
    </section>
  </main>
</body>
</html>
