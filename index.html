<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>繁化助手下載點</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff6da;
      color: #4a3f1f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
        "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      padding: 3rem 1.25rem;
      box-sizing: border-box;
    }
    main {
      width: 100%;
      max-width: 560px;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 2rem;
      text-align: center;
    }
    section {
      background: #fffdf5;
      border: 1px solid #ecdca3;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }
    h2 {
      font-size: 1.15rem;
      margin: 0 0 1rem;
    }

    /* 一個版本區塊＝一個版本號小標 + 該版本底下各分流的下載選項。
       之後同一個平台出新版本，就在同一個 section 裡再加一個
       .version-block（放在最上面，新版在前）——版本區塊之間的分隔線
       靠 + 這個相鄰兄弟選擇器自動出現，只有一個版本時完全不會畫出來，
       不用另外判斷「是不是第一個版本」。 */
    .version-block + .version-block {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid #ecdca3;
    }
    .version-label {
      margin: 0 0 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #9a8a54;
      letter-spacing: 0.02em;
    }
    /* 用 grid 切成剛好兩等分，不是 flex 的 space-between——space-between
       只會把兩塊推到最左/最右，中間那條界線實際上跟著兩塊各自的內容
       寬度跑，不是真正固定在正中間。grid-template-columns: 1fr 1fr
       保證第二欄永遠從容器正中間開始，Mac OS 12 那塊固定貼齊中線
       右側，不受文字/按鈕寬度影響。 */
    .tier-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .tier {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .tier span {
      font-size: 0.95rem;
    }
    .tier a {
      display: inline-block;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      background: #4a3f1f;
      color: #fff6da;
      text-decoration: none;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .empty-note {
      margin: 0;
      color: #9a8a54;
      font-size: 0.9rem;
    }
    /* white-space: pre-line 保留 .txt 檔裡的換行——跟主站
       zh-cn-to-tw-web 的 .notice-text（顯示「阿舍老師的叮嚀」那塊）
       同一個規則，這裡是同名但獨立的一份，因為這個頁面是完全獨立的
       orphan branch，沒有共用 style.css。 */
    .notice-text {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.7;
      color: #4a3f1f;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <main>
    <h1>繁化助手下載點</h1>

    <section>
      <h2>Mac</h2>
      <div class="version-block">
        <p class="version-label">1.3</p>
        <div class="tier-row">
          <div class="tier">
            <span>Mac OS 13（含）以上</span>
            <a href="https://github.com/beethoreven/zh-cn-to-tw-mac/releases/download/v1.3-13-plus/ZhCnToTw-1.3-13+.dmg">下載</a>
          </div>
          <div class="tier">
            <span>Mac OS 12（含）以下</span>
            <a href="https://github.com/beethoreven/zh-cn-to-tw-mac/releases/download/v1.3-12-minus/ZhCnToTw-1.3-12-.dmg">下載</a>
          </div>
        </div>
      </div>
      <div class="version-block">
        <p class="version-label">1.1</p>
        <div class="tier-row">
          <div class="tier">
            <span>Mac OS 13（含）以上</span>
            <a href="https://github.com/beethoreven/zh-cn-to-tw-mac/releases/download/v1.1-13-plus/ZhCnToTw-1.1-13+.dmg">下載</a>
          </div>
          <div class="tier">
            <span>Mac OS 12（含）以下</span>
            <a href="https://github.com/beethoreven/zh-cn-to-tw-mac/releases/download/v1.1-12-minus/ZhCnToTw-1.1-12-.dmg">下載</a>
          </div>
        </div>
      </div>
      <!-- 之後出新版本，在這個 section 裡、上面這個 .version-block
           之前再插一個新的 .version-block（新版在前）即可，分隔線會
           自動出現，不用改其他地方。 -->
    </section>

    <section>
      <h2>Windows</h2>
      <!-- 刻意只留目前這一個版本，不像 Mac 保留歷史版本區塊——Windows
           版還沒有版本追蹤/強制更新機制（見 zh-cn-to-tw-windows
           README「已知限制」），舊安裝檔留著下載沒有實際用途，只留
           最新版最單純。之後出新版本，直接把這個 .version-block 換成
           新版本號 + 新連結即可，不用像 Mac 那樣往下新增一個區塊。 -->
      <div class="version-block">
        <p class="version-label">1.3</p>
        <div class="tier">
          <span>Windows 10（1607 以上）／ Windows 11，64 位元</span>
          <a href="https://github.com/beethoreven/zh-cn-to-tw-windows/releases/download/v1.3/ZhCnToTw-Setup-1.3.exe">下載</a>
        </div>
      </div>
    </section>

    <section>
      <h2>安裝說明</h2>
      <p id="download-notice" class="notice-text">載入中...</p>
    </section>
  </main>

  <script>
    // 這個頁面是完全獨立的 orphan branch（update-page），沒有共用
    // zh-cn-to-tw-web main 分支的 script.js/API_BASE 變數，直接寫死
    // 正式後端網址。跟主站的 initTaNotice() 同一個模式：內容來源是
    // zh-cn-to-tw-backend repo 根目錄的 download_notice.txt，維護者
    // 編輯那份檔案、commit、push、部署即可更新這裡顯示的內容，不用
    // 碰這個頁面。不要求登入——下載頁本身就是給還沒安裝 App 的人看的。
    (function () {
      var API_BASE = "https://zh-cn-to-tw-backend.onrender.com";
      var el = document.getElementById("download-notice");
      fetch(API_BASE + "/api/download_notice")
        .then(function (res) { return res.json(); })
        .then(function (data) { el.textContent = data.text || "（目前沒有內容）"; })
        .catch(function () { el.textContent = "（載入失敗）"; });
    })();
  </script>
</body>
</html>
