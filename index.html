<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <!-- 只允許載入同一個站的檔案；腳本與樣式都放在外部檔案，不開 inline。
       frame-ancestors 寫在 meta 裡無效，所以不列。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>繁化助手下載點</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>繁化助手下載點</h1>

    <section>
      <h2>更新說明</h2>
      <p class="notice-text">2.3：
優化安全性機制。
Word 檔含有隱藏文字時會提示。
Stage 1 移除潤飾開關。
Windows 解除安裝時可選擇是否一併刪除登入狀態與設定。
Mac OS 11～13 修正本機 OCR 無法執行的問題。
Mac 第一次使用本機 OCR 需要較長的啟動時間，不再顯示啟動逾時。</p>
    </section>

    <section>
      <h2>Mac</h2>
      <!-- 每次出新版就新增一個 .version-block（放最上面，新版在前），
           分隔線靠 .version-block + .version-block 這個相鄰兄弟選擇器
           自動出現，不用改其他地方。舊版本只有在已經不該再被使用時才移除
           （例如被強制更新淘汰、min_version 已經超過它），2.3 起舊版都
           已移除。 -->
      <div class="version-block">
        <p class="version-label">2.3</p>
        <div class="tier-row">
          <div class="tier">
            <span>Mac OS 11（含）以上</span>
            <a href="https://github.com/beethoreven/zh-cn-to-tw-mac/releases/download/v2.3-11-plus/ZhCnToTw-2.3-11+.dmg">下載</a>
          </div>
          <div class="tier">
            <span>Mac OS 10.15</span>
            <a href="https://github.com/beethoreven/zh-cn-to-tw-mac/releases/download/v2.3-10-15/ZhCnToTw-2.3-10.15.dmg">下載</a>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2>Windows</h2>
      <!-- 跟 Mac 那個 section 同一個規則：
           每次出新版就新增一個 .version-block（放最上面，新版在前），
           保留舊版供人回退，分隔線靠 .version-block + .version-block
           這個相鄰兄弟選擇器自動出現，不用改其他地方。不要改寫既有的
           .version-block。只有某個舊版本已經不該再被使用時才移除它
           （例如被強制更新淘汰、min_version 已經超過它）。 -->
      <div class="version-block">
        <p class="version-label">2.3</p>
        <div class="tier">
          <span>Windows 10（1607 以上）／ Windows 11，64 位元</span>
          <a href="https://github.com/beethoreven/zh-cn-to-tw-windows/releases/download/v2.3/ZhCnToTw-Setup-2.3.exe">下載</a>
        </div>
      </div>
    </section>

    <section>
      <h2>安裝說明</h2>
      <p id="download-notice" class="notice-text">載入中...</p>
    </section>
  </main>

  <script src="notice.js"></script>
</body>
</html>
